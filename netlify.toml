[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web config is meant to be public (access is controlled by
  # Firestore security rules, not by hiding these values), but Netlify's
  # secrets scanner still flags them once Vite inlines them into the bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
